# EmuPi OS RetroArch defaults (tuned for Pi Zero)
savefile_directory = "/mnt/roms/saves"
savestate_directory = "/mnt/roms/states"
system_directory = "/mnt/roms/cores"
rgui_browser_directory = "/mnt/roms"
config_save_on_exit = "false"
menu_driver = "rgui"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_shader_enable = "false"
video_font_enable = "false"
video_max_swapchain_images = "2"
audio_driver = "alsa"
audio_latency = "96"
rewind_enable = "false"
pause_nonactive = "false"
quit_press_twice = "false"
confirm_on_exit = "false"
input_autodetect_enable = "true"
input_joypad_driver = "udev"
# Exit to launcher: Esc on keyboard, Start+Select on a gamepad
input_exit_emulator = "escape"
input_quit_gamepad_combo = "4"
input_menu_toggle = "f1"
input_save_state = "f2"
input_load_state = "f4"
# If video fails, try: video_driver = "sdl2"  /  If sound is wrong: audio_device = "hw:1"
